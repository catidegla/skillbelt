name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Validate skills
        run: node scripts/validate-skills.mjs

      # A pin nobody regenerates is worse than no pin, because it trains people
      # to reach for --force. The digests are only stable across these two
      # runners because .gitattributes pins the working tree to eol=lf, so this
      # step also catches anyone removing that line.
      - name: Skills match their pinned digests
        run: node scripts/update-lock.mjs --check

      - name: Test the digest
        run: node --test scripts/test-digest.mjs

      # These plant a script that tries the forbidden thing and assert it was
      # refused, so they fail if Node ever narrows what the permission model
      # covers rather than letting the flags become decorative.
      - name: Test the sandbox
        run: node --test scripts/test-sandbox.mjs

      - name: Test the parity checker
        run: node --test scripts/test-parity.mjs

      # The installer resolves home directories and joins paths differently on
      # Windows, which is exactly the thing that breaks without being noticed.
      - name: Smoke test the installer
        shell: bash
        run: |
          node bin/skillbelt.mjs list
          node bin/skillbelt.mjs doctor

          mkdir -p "$RUNNER_TEMP/scratch"
          cd "$RUNNER_TEMP/scratch"
          node "$GITHUB_WORKSPACE/bin/skillbelt.mjs" add --all --project --harness claude,codex,cursor,gemini

          for h in .claude .codex .cursor .gemini; do
            test -f "$h/skills/i18n-parity/SKILL.md" || { echo "missing SKILL.md in $h"; exit 1; }
            test -f "$h/skills/i18n-parity/scripts/check-parity.mjs" || { echo "missing nested script in $h"; exit 1; }
          done
          echo "installed into all four harnesses"

          test -f ".claude/skills/.skillbelt.json" || { echo "no install receipt written"; exit 1; }
          node "$GITHUB_WORKSPACE/bin/skillbelt.mjs" verify --project --harness claude,codex,cursor,gemini
          echo "verify passes on a clean install"

          printf '\n// injected\n' >> .claude/skills/i18n-parity/scripts/check-parity.mjs
          if node "$GITHUB_WORKSPACE/bin/skillbelt.mjs" verify --project --harness claude; then
            echo "verify did not notice a modified skill"
            exit 1
          fi
          echo "verify catches a modified skill"

          mkdir -p locales
          printf '{"a":"A","b":"B"}\n' > locales/en.json
          printf '{"a":"A"}\n' > locales/fr.json
          # run refuses on a runtime that cannot enforce what the manifest
          # denies, so assert on what it said and not only on the exit code.
          # A refusal and a real finding both exit 1 and mean opposite things.
          set +e
          out=$(node "$GITHUB_WORKSPACE/bin/skillbelt.mjs" run i18n-parity --quiet 2>&1)
          code=$?
          set -e
          echo "$out"

          if echo "$out" | grep -q "cannot enforce"; then
            echo "run correctly refused on a runtime whose permission model is incomplete"
          elif [ "$code" = "1" ] && echo "$out" | grep -q "missing"; then
            echo "sandboxed run works and reports through its exit code"
          else
            echo "run neither refused nor reported the missing key (exit $code)"
            exit 1
          fi

          node "$GITHUB_WORKSPACE/bin/skillbelt.mjs" remove --all --project --harness claude
          test ! -d ".claude/skills/i18n-parity" || { echo "remove did not clean up"; exit 1; }
          echo "remove works"

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Plugin manifests are valid JSON
        run: |
          node -e "
            for (const f of ['.claude-plugin/marketplace.json', '.claude-plugin/plugin.json', 'package.json']) {
              JSON.parse(require('fs').readFileSync(f, 'utf8'));
              console.log(f + ' ok');
            }
          "

      - name: Marketplace and plugin agree
        run: |
          node -e "
            const fs = require('fs');
            const market = JSON.parse(fs.readFileSync('.claude-plugin/marketplace.json', 'utf8'));
            const plugin = JSON.parse(fs.readFileSync('.claude-plugin/plugin.json', 'utf8'));
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const entry = market.plugins.find(p => p.name === plugin.name);
            if (!entry) throw new Error('plugin.json name is not listed in marketplace.json');
            if (entry.version !== plugin.version) throw new Error('version mismatch between marketplace and plugin manifest');
            if (pkg.version !== plugin.version) throw new Error('package.json version does not match plugin.json');
            console.log('manifests agree on version ' + plugin.version);
          "
